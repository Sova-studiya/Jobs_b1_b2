<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formal Language - Flashcards</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 70px 20px 20px;
            overflow-y: auto;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2em;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .progress {
            color: white;
            font-size: 1.2em;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.2);
            padding: 10px 25px;
            border-radius: 25px;
        }

        .card-container {
            width: 100%;
            max-width: 600px;
            height: 460px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 30px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .card-front {
            background: linear-gradient(135deg, #f0f9ff 0%, #bae6fd 100%);
            color: #333;
        }

        .card-back {
            background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
            color: white;
            transform: rotateY(180deg);
        }

        .russian-text {
            font-size: 1.9em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
            line-height: 1.3;
            color: #0369a1;
        }

        .informal-tag {
            font-size: 0.95em;
            color: #64748b;
            font-style: italic;
            margin-bottom: 18px;
            text-align: center;
        }

        .informal-tag span {
            background: #e2e8f0;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.9em;
        }

        .english-text {
            font-size: 1.9em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-tag {
            font-size: 0.8em;
            background: rgba(255,255,255,0.2);
            padding: 3px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .examples-box {
            width: 100%;
            background: rgba(255,255,255,0.15);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            max-height: 150px;
            overflow-y: auto;
        }

        .examples-title {
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 7px;
            border-bottom: 1px solid rgba(255,255,255,0.4);
            padding-bottom: 5px;
        }

        .example-item {
            margin: 6px 0;
            font-size: 0.92em;
            font-style: italic;
            line-height: 1.5;
        }

        .audio-btn {
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .audio-btn.front { background: #0369a1; color: white; }
        .audio-btn.front:hover { background: #075985; }
        .audio-btn.back { background: white; color: #0369a1; }
        .audio-btn.back:hover { background: #f0f9ff; }

        .controls {
            margin-top: 22px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-btn {
            background: white;
            color: #0369a1;
            border: none;
            padding: 14px 34px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .control-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .control-btn.secondary { background: rgba(255,255,255,0.2); color: white; }
        .control-btn.secondary:hover { background: rgba(255,255,255,0.3); }

        .hint {
            color: rgba(255,255,255,0.8);
            margin-top: 16px;
            font-size: 0.9em;
            text-align: center;
        }

        .shuffle-btn {
            position: fixed; top: 20px; right: 20px;
            background: rgba(255,255,255,0.2); color: white;
            border: 2px solid white; padding: 10px 20px;
            border-radius: 25px; cursor: pointer; font-size: 1em;
            transition: all 0.3s;
        }
        .shuffle-btn:hover { background: white; color: #0369a1; }

        .back-home {
            position: fixed; top: 20px; left: 20px;
            background: rgba(255,255,255,0.2); color: white;
            border: 2px solid white; padding: 10px 20px;
            border-radius: 25px; cursor: pointer; font-size: 1em;
            text-decoration: none; transition: all 0.3s;
        }
        .back-home:hover { background: white; color: #0369a1; }

        @media (max-width: 768px) {
            .card-container { height: 440px; }
            .russian-text { font-size: 1.6em; }
            .english-text { font-size: 1.6em; }
            h1 { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <h1>✉️ Formal Language</h1>
    <div class="progress" id="progress">Карточка 1 из 20</div>

    <a href="index.html" class="back-home">← Меню</a>
    <button class="shuffle-btn" onclick="shuffleCards()">🔀 Перемешать</button>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <div class="card-face card-front">
                <div class="russian-text" id="russianText">Загрузка...</div>
                <div class="informal-tag" id="informalTag"></div>
                <button class="audio-btn front" onclick="event.stopPropagation(); speakWord()">
                    🔊 Произнести
                </button>
                <div style="margin-top: 18px; opacity: 0.5; font-size: 0.9em;">Нажмите, чтобы перевернуть</div>
            </div>
            <div class="card-face card-back">
                <div class="english-text" id="englishText"></div>
                <div class="register-tag">✦ formal</div>
                <div class="examples-box">
                    <div class="examples-title">📝 Examples in job applications:</div>
                    <div id="examplesList"></div>
                </div>
                <button class="audio-btn back" onclick="event.stopPropagation(); speakWord()">
                    🔊 Произнести
                </button>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="control-btn secondary" onclick="prevCard(event)">← Назад</button>
        <button class="control-btn" onclick="nextCard(event)">Далее →</button>
    </div>

    <div class="hint">💡 Нажмите на карточку чтобы перевернуть<br>Используйте стрелки ← → на клавиатуре</div>

    <script>
        const vocabulary = [
            {
                russian: "позвонить → (формально)",
                informal: "call",
                english: "telephone",
                examples: [
                    "Please telephone me if you require further information.",
                    "You may telephone our office between 9 a.m. and 5 p.m.",
                    "I would be happy to telephone you to discuss the position."
                ]
            },
            {
                russian: "нужно, нужна → (формально)",
                informal: "need",
                english: "require",
                examples: [
                    "The position requires excellent communication skills.",
                    "Please let me know if you require any further details.",
                    "I have all the qualities that this role requires."
                ]
            },
            {
                russian: "получить → (формально)",
                informal: "get",
                english: "obtain",
                examples: [
                    "I hope to obtain a place on your training programme.",
                    "I obtained my qualification in June last year.",
                    "She obtained a reference from her previous employer."
                ]
            },
            {
                russian: "начальник → (формально)",
                informal: "boss",
                english: "manager",
                examples: [
                    "I can provide a reference from my current manager.",
                    "I report directly to the store manager.",
                    "My manager can confirm my experience."
                ]
            },
            {
                russian: "иметь → (формально)",
                informal: "have got",
                english: "possess",
                examples: [
                    "I possess the personal qualities necessary for this role.",
                    "She possesses excellent organisational skills.",
                    "I believe I possess the experience you are looking for."
                ]
            },
            {
                russian: "хорошо справляться → (формально)",
                informal: "do well",
                english: "succeed",
                examples: [
                    "I am confident I would succeed in this position.",
                    "I have always succeeded in customer-facing roles.",
                    "I hope to succeed and grow within your company."
                ]
            },
            {
                russian: "свободен, не занят → (формально)",
                informal: "free",
                english: "available",
                examples: [
                    "I am available to start work immediately.",
                    "I am available for an interview at any time.",
                    "I will be available from the 1st of September."
                ]
            },
            {
                russian: "много, масса → (формально)",
                informal: "lots of",
                english: "many",
                examples: [
                    "There are many reasons why I wish to join your team.",
                    "I have many years of experience in retail.",
                    "I have completed many relevant courses."
                ]
            },
            {
                russian: "хотел бы → (формально)",
                informal: "would like",
                english: "wish",
                examples: [
                    "I wish to apply for the position of sales assistant.",
                    "I wish to be considered for this role.",
                    "I wish to develop my career within your organisation."
                ]
            },
            {
                russian: "поговорить о → (формально)",
                informal: "chat about",
                english: "discuss",
                examples: [
                    "I would welcome the opportunity to discuss my application.",
                    "I am keen to discuss how I can contribute to your team.",
                    "Please contact me if you wish to discuss my experience."
                ]
            },
            {
                russian: "возможность → (формально)",
                informal: "chance",
                english: "opportunity",
                examples: [
                    "I would be grateful for the opportunity to attend an interview.",
                    "This is an excellent opportunity to develop my skills.",
                    "I welcome the opportunity to work with your team."
                ]
            },
            {
                russian: "сделать → (формально)",
                informal: "do (exams)",
                english: "sit (exams)",
                examples: [
                    "I will sit my final exams in June.",
                    "I have already sat my English language exams.",
                    "She sat her qualifications last summer."
                ]
            },
            {
                russian: "резюме",
                informal: "résumé (AmE)",
                english: "CV (curriculum vitae)",
                examples: [
                    "Please find my CV attached to this email.",
                    "My CV shows my full work history.",
                    "I have included a CV with details of my experience."
                ]
            },
            {
                russian: "подавать заявление на работу",
                informal: "apply for a job",
                english: "apply for a position / post",
                examples: [
                    "I am writing to apply for the position of shop assistant.",
                    "I wish to apply for the post advertised on your website.",
                    "I am applying for the position of part-time cashier."
                ]
            },
            {
                russian: "рекомендательное письмо",
                informal: "—",
                english: "reference / referee",
                examples: [
                    "I can provide two references on request.",
                    "My referee is my current manager, Mr Brown.",
                    "Please find contact details for my referee below."
                ]
            },
            {
                russian: "прилагаю / приложено",
                informal: "I'm sending you…",
                english: "I enclose… / Please find enclosed…",
                examples: [
                    "Please find enclosed my CV and covering letter.",
                    "I enclose a copy of my qualifications.",
                    "Please find enclosed the documents you requested."
                ]
            },
            {
                russian: "с нетерпением жду ответа",
                informal: "Hope to hear from you",
                english: "I look forward to hearing from you",
                examples: [
                    "I look forward to hearing from you at your earliest convenience.",
                    "I look forward to hearing from you regarding this application.",
                    "I look forward to hearing from you and hope to meet soon."
                ]
            },
            {
                russian: "с уважением (когда знаешь имя)",
                informal: "Bye / Best wishes",
                english: "Yours sincerely",
                examples: [
                    "Yours sincerely, Anna Petrova. (= you know the name)",
                    "Always write 'Yours sincerely' after 'Dear Mr Smith'.",
                    "End a formal letter to a named person with 'Yours sincerely'."
                ]
            },
            {
                russian: "с уважением (когда не знаешь имя)",
                informal: "Bye / Best wishes",
                english: "Yours faithfully",
                examples: [
                    "Yours faithfully, Anna Petrova. (= you don't know the name)",
                    "Use 'Yours faithfully' after 'Dear Sir or Madam'.",
                    "If you wrote 'Dear Sir', close with 'Yours faithfully'."
                ]
            },
            {
                russian: "я был бы признателен за…",
                informal: "I'd love…",
                english: "I would be grateful for…",
                examples: [
                    "I would be grateful for the opportunity to attend an interview.",
                    "I would be grateful for any further information.",
                    "I would be grateful if you could consider my application."
                ]
            }
        ];

        let shuffled = [], currentIndex = 0, currentItem = null;

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function shuffleCards() {
            shuffled = shuffleArray(vocabulary);
            currentIndex = 0;
            document.getElementById('card').classList.remove('flipped');
            setTimeout(showCard, 300);
        }

        function showCard() {
            currentItem = shuffled[currentIndex];
            document.getElementById('russianText').textContent = currentItem.russian;
            const inf = currentItem.informal && currentItem.informal !== '—'
                ? `informal: <span>${currentItem.informal}</span>`
                : currentItem.informal === '—' ? '' : '';
            document.getElementById('informalTag').innerHTML = inf;
            document.getElementById('englishText').textContent = currentItem.english;
            document.getElementById('examplesList').innerHTML =
                currentItem.examples.map(e => `<div class="example-item">• ${e}</div>`).join('');
            document.getElementById('progress').textContent =
                `Карточка ${currentIndex + 1} из ${vocabulary.length}`;
        }

        function flipCard() {
            document.getElementById('card').classList.toggle('flipped');
        }

        function nextCard(e) {
            if (e) e.stopPropagation();
            if (currentIndex < shuffled.length - 1) {
                document.getElementById('card').classList.remove('flipped');
                setTimeout(() => { currentIndex++; showCard(); }, 300);
            } else {
                if (confirm('Поздравляем! Вы просмотрели все карточки!\n\nНачать заново?')) shuffleCards();
            }
        }

        function prevCard(e) {
            if (e) e.stopPropagation();
            if (currentIndex > 0) {
                document.getElementById('card').classList.remove('flipped');
                setTimeout(() => { currentIndex--; showCard(); }, 300);
            }
        }

        function speakWord() {
            if (!('speechSynthesis' in window)) return;
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(currentItem.english);
            u.lang = 'en-US'; u.rate = 0.85;
            speechSynthesis.speak(u);
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextCard(); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); prevCard(); }
            else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); flipCard(); }
        });

        shuffleCards();
    </script>
</body>
</html>
